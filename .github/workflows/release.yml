name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Jimmy.exe
        run: pyinstaller jimmy.spec --noconfirm --clean
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Installateur
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\jimmy.iss
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Jimmy-Setup-*.exe
          generate_release_notes: true
